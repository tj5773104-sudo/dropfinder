services:
  - type: web
    name: dropfinder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MAX_DOMAINS
        value: "400"
      - key: JOBS_PER_IP_PER_HOUR
        value: "5"
