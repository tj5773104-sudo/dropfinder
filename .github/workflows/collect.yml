name: weekly-lists

on:
  schedule:
    - cron: "41 2 * * 0"   # Sundays 02:41 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "wiki, wordpress, or blank for both"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-lists
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build big domain lists
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python dropfinder.py collect --only "${{ github.event.inputs.only }}"
          else
            python dropfinder.py collect
          fi
      - name: Commit lists
        if: always()
        run: |
          git config user.name "dropfinder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lists/ || true
          git diff --cached --quiet && exit 0
          git commit -m "weekly lists $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
